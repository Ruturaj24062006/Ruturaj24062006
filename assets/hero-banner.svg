<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="300" fill="none">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050b18" />
      <stop offset="60%" stop-color="#0a1226" />
      <stop offset="100%" stop-color="#0d1b3a" />
    </linearGradient>
    
    <radialGradient id="glow-grad" cx="85%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#0ea5e9" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0" />
    </radialGradient>

    <!-- Grid Mask for smooth fading transition -->
    <linearGradient id="grid-mask-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0" />
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.45" />
    </linearGradient>
    
    <mask id="grid-mask">
      <rect x="650" y="10" width="530" height="280" fill="url(#grid-mask-grad)" />
    </mask>

    <!-- Grid Pattern -->
    <pattern id="dot-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1" fill="#38bdf8" />
    </pattern>

    <!-- Professional Web Fonts -->
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&amp;family=JetBrains+Mono:wght@400;700&amp;display=swap');
      
      .font-name {
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 800;
        font-size: 38px;
        fill: #f8fafc;
        letter-spacing: 0.16em;
      }
      
      .font-role {
        font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-weight: 700;
        font-size: 15px;
        fill: #38bdf8;
        letter-spacing: 0.32em;
      }
      
      .font-sub {
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 500;
        font-size: 14px;
        fill: #94a3b8;
        letter-spacing: 0.12em;
      }
      
      .font-location {
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 500;
        font-size: 11px;
        fill: #475569;
        letter-spacing: 0.08em;
      }

      .net-line-dim {
        stroke: #38bdf8;
        stroke-opacity: 0.08;
        stroke-width: 1;
      }

      .net-line-medium {
        stroke: #38bdf8;
        stroke-opacity: 0.22;
        stroke-width: 1.2;
      }

      .net-line-active {
        stroke: #0ea5e9;
        stroke-opacity: 0.45;
        stroke-width: 1.5;
        stroke-dasharray: 4 2;
      }

      .node-core {
        fill: #38bdf8;
      }

      .node-glow {
        fill: #0ea5e9;
        fill-opacity: 0.25;
      }

      .node-pulse {
        fill: #ffffff;
        fill-opacity: 0.8;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="300" rx="14" fill="url(#bg-grad)" />
  <rect width="1200" height="300" rx="14" fill="url(#glow-grad)" />
  
  <!-- Sleek Border -->
  <rect x="0.5" y="0.5" width="1199" height="299" rx="13.5" stroke="#1e293b" stroke-opacity="0.8" />

  <!-- Data Grid Layer -->
  <rect x="650" y="10" width="530" height="280" fill="url(#dot-grid)" mask="url(#grid-mask)" />

  <!-- Neural Network Connections -->
  <g>
    <!-- Background Dim Connections -->
    <line x1="820" y1="150" x2="880" y2="90" class="net-line-dim" />
    <line x1="820" y1="150" x2="880" y2="210" class="net-line-dim" />
    <line x1="880" y1="90" x2="940" y2="60" class="net-line-dim" />
    <line x1="880" y1="210" x2="940" y2="240" class="net-line-dim" />
    <line x1="940" y1="60" x2="1000" y2="100" class="net-line-dim" />
    <line x1="940" y1="240" x2="1000" y2="200" class="net-line-dim" />
    <line x1="1000" y1="100" x2="1060" y2="60" class="net-line-dim" />
    <line x1="1000" y1="200" x2="1060" y2="240" class="net-line-dim" />
    <line x1="1060" y1="60" x2="1120" y2="110" class="net-line-dim" />
    <line x1="1060" y1="240" x2="1120" y2="190" class="net-line-dim" />

    <!-- Midground Medium Connections -->
    <line x1="880" y1="90" x2="940" y2="150" class="net-line-medium" />
    <line x1="880" y1="210" x2="940" y2="150" class="net-line-medium" />
    <line x1="940" y1="150" x2="1000" y2="100" class="net-line-medium" />
    <line x1="940" y1="150" x2="1000" y2="200" class="net-line-medium" />
    <line x1="1000" y1="100" x2="1060" y2="150" class="net-line-medium" />
    <line x1="1000" y1="200" x2="1060" y2="150" class="net-line-medium" />
    <line x1="1060" y1="150" x2="1120" y2="110" class="net-line-medium" />
    <line x1="1060" y1="150" x2="1120" y2="190" class="net-line-medium" />

    <!-- Foreground Highlighted/Active Path -->
    <line x1="820" y1="150" x2="940" y2="150" class="net-line-active" />
    <line x1="940" y1="150" x2="1000" y2="200" class="net-line-active" />
    <line x1="1000" y1="200" x2="1060" y2="150" class="net-line-active" />
    <line x1="1060" y1="150" x2="1120" y2="150" class="net-line-active" />
  </g>

  <!-- Neural Network Nodes -->
  <g>
    <!-- Node P1 (820, 150) -->
    <circle cx="820" cy="150" r="8" class="node-glow" />
    <circle cx="820" cy="150" r="3.5" class="node-core" />
    <circle cx="820" cy="150" r="1.5" class="node-pulse" />

    <!-- Node P2 (880, 90) -->
    <circle cx="880" cy="90" r="2.5" class="node-core" />

    <!-- Node P3 (880, 210) -->
    <circle cx="880" cy="210" r="2.5" class="node-core" />

    <!-- Node P4 (940, 60) -->
    <circle cx="940" cy="60" r="2" class="node-core" opacity="0.6" />

    <!-- Node P5 (940, 150) -->
    <circle cx="940" cy="150" r="10" class="node-glow" />
    <circle cx="940" cy="150" r="4.5" class="node-core" />
    <circle cx="940" cy="150" r="2" class="node-pulse" />

    <!-- Node P6 (940, 240) -->
    <circle cx="940" cy="240" r="2" class="node-core" opacity="0.6" />

    <!-- Node P7 (1000, 100) -->
    <circle cx="1000" cy="100" r="3" class="node-core" />

    <!-- Node P8 (1000, 200) -->
    <circle cx="1000" cy="200" r="9" class="node-glow" />
    <circle cx="1000" cy="200" r="4" class="node-core" />

    <!-- Node P9 (1060, 60) -->
    <circle cx="1060" cy="60" r="2" class="node-core" opacity="0.6" />

    <!-- Node P10 (1060, 150) -->
    <circle cx="1060" cy="150" r="9" class="node-glow" />
    <circle cx="1060" cy="150" r="4" class="node-core" />

    <!-- Node P11 (1060, 240) -->
    <circle cx="1060" cy="240" r="2" class="node-core" opacity="0.6" />

    <!-- Node P12 (1120, 110) -->
    <circle cx="1120" cy="110" r="2.5" class="node-core" />

    <!-- Node P13 (1120, 190) -->
    <circle cx="1120" cy="190" r="2.5" class="node-core" />

    <!-- Node P14 (1120, 150) -->
    <circle cx="1120" cy="150" r="7" class="node-glow" />
    <circle cx="1120" cy="150" r="3.5" class="node-core" />
  </g>

  <!-- Typography Content -->
  <!-- Left accent bar -->
  <rect x="50" y="70" width="3" height="155" fill="#38bdf8" rx="1.5" opacity="0.8" />

  <g transform="translate(75, 0)">
    <!-- Main Name -->
    <text x="0" y="112" class="font-name">RUTURAJ AMBURE</text>

    <!-- Subtitle Role -->
    <text x="2" y="148" class="font-role">AI / ML ENGINEER</text>

    <!-- Core focus tagline -->
    <text x="2" y="196" class="font-sub">Applied AI • Computer Vision • Intelligent Systems</text>

    <!-- Education / Location Details -->
    <text x="2" y="222" class="font-location">VIT Pune  /  Pune, India</text>
  </g>

</svg>
